<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>날짜별 중계 안내</title>
<meta name="description" content="2026 프로야구 날짜별 경기 일정과 중계 채널, TV·모바일 시청 방법을 정리합니다.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html"><i aria-hidden="true"></i>2026 프로야구 일정 중계</a>
  <nav class="nav" aria-label="주요 메뉴">
    <a href="index.html#schedule">남은 일정</a>
    <a href="guide-tv.html">TV 중계 채널</a>
    <a href="guide-tving.html">모바일 시청법</a>
  </nav>
</div></header>
<main class="post"><div class="wrap" id="art"><p>불러오는 중입니다…</p></div></main>
<script src="common.js"></script>
<script>
const art = document.getElementById("art");
async function render(){
  const data = await loadSchedule(), now = new Date();
  const days = [...new Set(data.games.filter(g => g.a).map(g => g.d))];
  let d = decodeURIComponent(location.hash.slice(1));
  if (!days.includes(d)) { // 날짜가 없으면 다음 경기일로
    d = days.find(x => data.games.some(g => g.d === x && status(g, now) !== "done")) || days[days.length - 1];
    history.replaceState(null, "", "#" + d);
  }
  const gs = data.games.filter(g => g.d === d && g.a);
  const i = days.indexOf(d), prev = days[i - 1], next = days[i + 1];
  const allDone = gs.every(g => status(g, now) === "done");
  const upcomingDay = days.find(x => data.games.some(g => g.d === x && status(g, now) !== "done"));
  const one = gs.length === 1 ? gs[0] : null;
  const title = one ? `${shortDate(d)} ${one.sr} ${one.a} vs ${one.h} 중계 채널 및 시청 방법 총정리`
                    : `${shortDate(d)} 프로야구 중계 채널 및 경기 일정 총정리 (${gs.length}경기)`;
  document.title = `${shortDate(d)} 프로야구 중계 안내`;
  const chs = [...new Map(gs.flatMap(g => g.tv).map(c => [c, channel(c)])).values()];
  const ps = gs.some(g => POST.includes(g.sr)), intl = gs.every(g => g.sr === "국제대회");
  const matchup = one ? `${one.a} vs ${one.h}` : `${gs.length}경기`;

  art.innerHTML = `
  <h1>${esc(title)}</h1>
  <div class="meta">${dateLabel(d)} · KBO 공식 일정 기준 · 갱신 ${esc(data.updated.slice(0,16).replace("T"," "))}</div>
  ${allDone ? `<div class="note done-banner">이 날 경기는 모두 끝났습니다. ${upcomingDay && upcomingDay !== d ? `다음 경기는 <a href="#${upcomingDay}">${dateLabel(upcomingDay)}</a>입니다.` : "남은 경기가 없습니다."}</div>` : ""}

  <p>${shortDate(d)} ${esc(matchup)} 경기, 어느 채널에서 하는지 찾고 계신가요?</p>
  <p>${ps ? "포스트시즌은 경기마다 중계 방송사가 바뀌어서" : intl ? "국제대회는 방송사 편성이 늦게 확정되는 경우가 많아서" : "정규시즌은 하루 다섯 경기를 채널 다섯 곳이 나눠 맡아서"} 평소 보던 채널을 틀면 다른 경기가 나오기 쉽습니다.</p>
  <p>오늘은 ${shortDate(d)} 경기 일정과 중계 채널, TV가 없을 때 휴대폰으로 보는 법까지 순서대로 알려드리도록 하겠습니다.</p>

  <h2>1. ${shortDate(d)} 경기 일정</h2>
  <p>경기 시간과 구장은 아래 표와 같습니다. 우천 등으로 일정이 바뀌면 이 표도 자동으로 바뀝니다.</p>
  <p class="pointer">▼ ${shortDate(d)} 경기 일정표</p>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>시간</th><th>경기</th><th>구장</th><th>구분</th><th>상태</th></tr></thead>
    <tbody>${gs.map(g => { const s = status(g, now); return `<tr><td>${esc(g.t)}</td><td><b>${esc(g.a)} vs ${esc(g.h)}</b></td><td>${esc(g.st)}</td><td>${esc(g.sr)}</td><td>${
      s === "cancel" || (s === "done" && cancelled(g)) ? esc(g.n) : s === "done" ? (g.sc ? `종료 ${g.sc[0]}:${g.sc[1]}` : "종료") : s === "live" ? '<span class="badge live">진행 중</span>' : (dday(g.d, now) || "예정")}</td></tr>`; }).join("")}</tbody>
  </table></div>

  <h2>2. TV 중계 채널</h2>
  ${chs.length ? `<p>${shortDate(d)} 경기는 아래 채널에서 중계합니다. 채널 번호는 쓰시는 IPTV·케이블마다 다르니 버튼을 눌러 찾는 법을 확인해 보세요.</p>
  ${gs.map(g => `<p class="check">✅ ${esc(g.a)} vs ${esc(g.h)} : ${g.tv.length ? g.tv.map(c => esc(channel(c).name)).join(", ") : "발표 전"}</p>`).join("")}
  <p class="pointer">▼ 채널 번호 찾는 법 바로가기</p>
  ${chs.slice(0, 3).map(c => `<a class="btn" href="guide-tv.html#${c.key}">${esc(c.name)} 채널 번호 확인하기 &gt;&gt;</a>`).join("")}
  ${chs.length > 3 ? `<div class="chips">${chs.slice(3).map(c => `<a class="chip" href="guide-tv.html#${c.key}">📺 ${esc(c.name)}</a>`).join("")}</div>` : ""}`
  : `<p>아직 KBO 일정에 TV 중계 방송사가 올라오지 않았습니다. 방송사가 정해지면 이 자리에 자동으로 표시됩니다.</p>
  ${gs.map(g => `<p class="check">✅ ${esc(g.a)} vs ${esc(g.h)} : 중계 채널 발표 전</p>`).join("")}
  <p class="pointer">▼ 그동안 채널별 중계 안내를 확인해 보세요</p>
  <a class="btn" href="guide-tv.html">프로야구 TV 중계 채널 총정리 &gt;&gt;</a>`}

  <h2>3. 휴대폰·PC로 보는 법</h2>
  <p>TV 앞에 없다면 휴대폰으로도 볼 수 있습니다. ${intl ? "국제대회는 대회마다 온라인 중계사가 달라 발표를 확인해야 합니다." : "2026 시즌 KBO 리그 경기는 티빙에서 생중계합니다."}</p>
  <p>다만 이용권을 아무거나 결제하면 손해일 수 있으니 먼저 고르는 법을 확인해 보세요.</p>
  <p class="pointer">▼ 아래 버튼을 눌러 확인해 보세요</p>
  <a class="btn" href="guide-tving.html">티빙으로 프로야구 보는 법 &gt;&gt;</a>

  <h2>4. 놓친 경기 다시보기</h2>
  <p>경기 시간을 놓쳤다면 다시보기나 하이라이트로 확인할 수 있습니다. 경기가 끝난 뒤 보통 몇 시간 안에 올라옵니다.</p>
  <p class="pointer">▼ 다시보기 방법 바로가기</p>
  <a class="btn" href="guide-tving.html#replay">프로야구 다시보기·하이라이트 보는 법 &gt;&gt;</a>

  <nav class="pager" aria-label="다른 날짜">
    ${prev ? `<a href="#${prev}"><small>← 이전 경기일</small>${dateLabel(prev)}</a>` : "<span style='flex:1'></span>"}
    ${next ? `<a class="next-day" href="#${next}"><small>다음 경기일 →</small>${dateLabel(next)}</a>` : "<span style='flex:1'></span>"}
  </nav>
  <a class="btn ghost" href="index.html#schedule" style="margin-top:14px">남은 경기 전체 일정 보기 &gt;&gt;</a>
  `;
  window.scrollTo(0, 0);
}
render().catch(e => art.innerHTML = `<p>${esc(e.message)}</p>`);
addEventListener("hashchange", () => render());
</script>
<div class="wrap">  <footer>
    <p>일정 출처: KBO 공식 일정 · 이 사이트는 KBO·방송사와 관계없는 일정 안내 사이트이며, 방송사 사이트로 바로 연결하지 않습니다.</p>
  </footer></div></body></html>
